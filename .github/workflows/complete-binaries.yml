name: Complete binary files from upstream

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/complete-binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out upstream project
        uses: actions/checkout@v4
        with:
          repository: antlis/tg-streaming-bot
          ref: main
          path: upstream
          fetch-depth: 1

      - name: Copy missing binary assets
        run: |
          set -euo pipefail
          mkdir -p assets driver/source
          cp upstream/assets/demo.gif assets/demo.gif
          cp upstream/driver/source/LightBlue.png driver/source/LightBlue.png
          cp upstream/driver/source/medium.ttf driver/source/medium.ttf
          cp upstream/driver/source/regular.ttf driver/source/regular.ttf
          cmp upstream/assets/demo.gif assets/demo.gif
          cmp upstream/driver/source/LightBlue.png driver/source/LightBlue.png
          cmp upstream/driver/source/medium.ttf driver/source/medium.ttf
          cmp upstream/driver/source/regular.ttf driver/source/regular.ttf

      - name: Commit and push binary assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f assets/demo.gif driver/source/LightBlue.png driver/source/medium.ttf driver/source/regular.ttf
          if git diff --cached --quiet; then
            echo "Binary files already match upstream."
            exit 0
          fi
          git commit -m "Copy remaining binary assets from upstream"
          git push origin HEAD:main
