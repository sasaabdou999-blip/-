services:
  - type: worker
    name: telegram-music-bot
    runtime: docker
    plan: 1c-2g
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit
    maxShutdownDelaySeconds: 60
    envVars:
      # Required credentials — add secret values in the Render dashboard
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: BOT_USERNAME
        sync: false
      - key: SESSION_NAME
        sync: false
      - key: SUDO_USERS
        sync: false

      # Bot display settings
      - key: BOT_NAME
        value: Music Bot
      - key: ASSISTANT_NAME
        sync: false
      - key: OWNER_NAME
        sync: false
      - key: ALIVE_NAME
        sync: false
      - key: GROUP_SUPPORT
        sync: false
      - key: UPDATES_CHANNEL
        sync: false
      - key: UPSTREAM_REPO
        value: https://github.com/sasaabdou999-blip/-

      # Playback and cache settings
      - key: DURATION_LIMIT
        value: "240"
      - key: DOWNLOADS_CACHE_LIMIT_MB
        value: "1024"
      - key: IDLE_LEAVE_MINUTES
        value: "10"
      - key: COMMAND_PREFIXES
        value: "/ ! ."
      - key: SPONSORBLOCK_REMOVE
        sync: false

      # Optional proxy settings — leave unset unless needed
      - key: PROXY_SCHEME
        sync: false
      - key: PROXY_HOST
        sync: false
      - key: PROXY_PORT
        sync: false
      - key: PROXY_USER
        sync: false
      - key: PROXY_PASS
        sync: false
      - key: PROXY_URL
        sync: false

      # Optional radio configuration
      - key: RADIO_STATIONS
        sync: false
      - key: RADIO_IMG
        sync: false
      - key: ALIVE_IMG
        sync: false
      - key: IMG_1
        sync: false
      - key: IMG_2
        sync: false
      - key: IMG_3
        sync: false
      - key: IMG_4
        sync: false
